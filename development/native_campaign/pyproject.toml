[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-native-campaign-engineering"
version = "0.1.0"
description = "Explicit, no-network native SIM campaign composition acceptance"
requires-python = ">=3.11"
dependencies = [
  "kairos-core", "kairos-persistence", "kairos-strategy-engine",
  "kairos-router", "kairos-llm", "kairos-aggregator", "kairos-risk-manager",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<0.17"]

[tool.uv]
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@6937eb4773fc00afaf5ba4e020b28b689f48e377",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@ea0c73395352f71da196270fe16659f1f0298a52",
  "kairos-strategy-engine @ git+https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git@977f71c18354279c432856fdc0c1858b5606c49d",
  "kairos-router @ git+https://github.com/Kairos-cryptoAI/kairos-router.git@bb3eb590d50386e3af7f12882ff600c6aaf9442c",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@c2207a5bd8bbf39e7d5728f95e52c96a47eca344",
  "kairos-aggregator @ git+https://github.com/Kairos-cryptoAI/kairos-aggregator.git@4c1325ca8803a6f06443cbb73e7209a55f29bc1c",
  "kairos-risk-manager @ git+https://github.com/Kairos-cryptoAI/kairos-risk-manager.git@908809200a49ec8091ce9f4d6208f461d2ee43c7",
]

[tool.hatch.build.targets.wheel]
packages = ["kairos_native_campaign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "kairos-current-chain-verification"
version = "0.1.0"
description = "Opt-in bounded verification of the current Catalyst, context, model and SIM components"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-native-campaign-engineering",
  "kairos-adaptive-development-replay",
  "kairos-core", "kairos-persistence", "kairos-strategy-engine",
  "kairos-router", "kairos-llm", "kairos-aggregator", "kairos-risk-manager",
  "kairos-execution-engine", "kairos-text-scouts", "kairos-macro-strategist",
  "kairos-quant-scouts", "kairos-backtest",
  "certifi>=2026.10.19",
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff>=0.16,<0.17",
]

[tool.uv]
package = false
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@506628fc8686ff7373d72f37ac032e53a47b233f",
  "kairos-strategy-engine @ git+https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git@9ff13e780d1e936431ef7e153a34120debd21bb5",
  "kairos-router @ git+https://github.com/Kairos-cryptoAI/kairos-router.git@a373e62071e8b68b29f9f4567001d330a6ef2aec",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@58640a0d285ec6ae193a94479d0cd18d7815c860",
  "kairos-aggregator @ git+https://github.com/Kairos-cryptoAI/kairos-aggregator.git@0bcfbb639efdcbf91d401c643c6fd1cf1f1d9564",
  "kairos-risk-manager @ git+https://github.com/Kairos-cryptoAI/kairos-risk-manager.git@c37f6d7be446b2a906b9cba80ea31da4d12dbae3",
  "kairos-execution-engine @ git+https://github.com/Kairos-cryptoAI/kairos-execution-engine.git@16706091279f49a3b424b75e57a3c2ce41fa10c4",
  "kairos-text-scouts @ git+https://github.com/Kairos-cryptoAI/kairos-text-scouts.git@b74a4f97cf47f785d292b5b5b2ca2dd7d2db9e06",
  "kairos-macro-strategist @ git+https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git@0937ce34e6f09516ced1579e9d830895e5f190ac",
  "kairos-quant-scouts @ git+https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git@0a7c3b69bf2b2e55ab23d5c23da8ca884c06b301",
  "kairos-backtest @ git+https://github.com/Kairos-cryptoAI/kairos-backtest.git@da1237854066fde381542e43c106d0de727448be",
]

[tool.uv.sources]
kairos-native-campaign-engineering = { path = "..", editable = false }
kairos-adaptive-development-replay = { path = "../../adaptive_replay", editable = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kairos_native_campaign"]

[project]
name = "kairos-current-chain-verification"
version = "0.1.0"
description = "Opt-in bounded verification of the current Catalyst, context, model and SIM components"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-native-campaign-engineering",
  "kairos-adaptive-development-replay",
  "kairos-core", "kairos-persistence", "kairos-strategy-engine",
  "kairos-router", "kairos-llm", "kairos-aggregator", "kairos-risk-manager",
  "kairos-execution-engine", "kairos-text-scouts", "kairos-macro-strategist",
  "kairos-quant-scouts", "kairos-backtest",
  "certifi>=2026.10.19",
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff>=0.16,<0.17",
]

[tool.uv]
package = false
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@752c984ca276ccbb7fcbd1b60a6c75d95fe6f108",
  "kairos-strategy-engine @ git+https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git@236361a40788ab80d857c7b2cd6a6a57d4440010",
  "kairos-router @ git+https://github.com/Kairos-cryptoAI/kairos-router.git@6c3c69b8b45b27e0f8f6e7caa15a193e78d5d920",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@f67ca208d65c430d93dd6e5e242797191b4017f2",
  "kairos-aggregator @ git+https://github.com/Kairos-cryptoAI/kairos-aggregator.git@12980c1eee7d0985057db2048afab9a5e8ac4581",
  "kairos-risk-manager @ git+https://github.com/Kairos-cryptoAI/kairos-risk-manager.git@4cb86b84ff0d62f309fca5f67643dbbc3404ada8",
  "kairos-execution-engine @ git+https://github.com/Kairos-cryptoAI/kairos-execution-engine.git@6570747f9e277084dec4d1bfe6a0707ada83722b",
  "kairos-text-scouts @ git+https://github.com/Kairos-cryptoAI/kairos-text-scouts.git@50f9f66d9114d930eb95d901bc09e03d6ba149b6",
  "kairos-macro-strategist @ git+https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git@a49487e9872e9fc66f5183cedaa80ee43e8cf8b5",
  "kairos-quant-scouts @ git+https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git@79e71fd5f2c1da7164fd0c9a90b4fffd7a52c65f",
  "kairos-backtest @ git+https://github.com/Kairos-cryptoAI/kairos-backtest.git@da1237854066fde381542e43c106d0de727448be",
]

[tool.uv.sources]
kairos-native-campaign-engineering = { path = "..", editable = false }
kairos-adaptive-development-replay = { path = "../../adaptive_replay", editable = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kairos_native_campaign"]

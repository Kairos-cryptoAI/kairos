[project]
name = "kairos-current-chain-verification"
version = "0.1.0"
description = "Opt-in bounded verification of the current Catalyst, context, model and SIM components"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-native-campaign-engineering",
  "kairos-adaptive-development-replay",
  "kairos-core", "kairos-persistence", "kairos-strategy-engine",
  "kairos-router", "kairos-llm", "kairos-aggregator", "kairos-risk-manager",
  "kairos-execution-engine", "kairos-text-scouts", "kairos-macro-strategist",
  "kairos-quant-scouts", "kairos-backtest",
  "certifi>=2026.10.19",
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff>=0.16,<0.17",
]

[tool.uv]
package = false
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@c6773575a09f918b4d495848705b4234f73f3a32",
  "kairos-strategy-engine @ git+https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git@30d1315fdcd96b277a87cb59c1819c476344a83c",
  "kairos-router @ git+https://github.com/Kairos-cryptoAI/kairos-router.git@e7c7ddd71125abff0e5d5af0b116301bc3921890",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@f67ca208d65c430d93dd6e5e242797191b4017f2",
  "kairos-aggregator @ git+https://github.com/Kairos-cryptoAI/kairos-aggregator.git@edff2f56a7de4c7065d8d86d2ce2a8997d1b3133",
  "kairos-risk-manager @ git+https://github.com/Kairos-cryptoAI/kairos-risk-manager.git@4eb6de55ee68d742b2583932c2e0d8f98b65949d",
  "kairos-execution-engine @ git+https://github.com/Kairos-cryptoAI/kairos-execution-engine.git@d544ae9d9ac4eaa1670f02c7772899c42946756c",
  "kairos-text-scouts @ git+https://github.com/Kairos-cryptoAI/kairos-text-scouts.git@23654f101f43dba7d73f5417a22737c32b7c8afa",
  "kairos-macro-strategist @ git+https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git@91af931a21d956d2b7b310d4d85456254da59c03",
  "kairos-quant-scouts @ git+https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git@cbd8e60b05952c4238aa51a13bc4327350b8e643",
  "kairos-backtest @ git+https://github.com/Kairos-cryptoAI/kairos-backtest.git@da1237854066fde381542e43c106d0de727448be",
]

[tool.uv.sources]
kairos-native-campaign-engineering = { path = "..", editable = false }
kairos-adaptive-development-replay = { path = "../../adaptive_replay", editable = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kairos_native_campaign"]

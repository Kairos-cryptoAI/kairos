name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out pinned Quant measurement source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Kairos-cryptoAI/kairos-quant-scouts
          ref: d53a87a9261335548513ff8763e958bd28704414
          path: ops-test-quant
      - name: Validate runner, manifest, and documentation links
        shell: pwsh
        run: ./tests/Test-Meta.Static.ps1
      - name: Verify non-trading Telegram handoff offline
        env:
          KAIROS_TEST_QUANT_SOURCE: ${{ github.workspace }}\ops-test-quant\kairos_quant\venue_comparison.py
        shell: pwsh
        run: |
          python -m unittest discover -s development/ops_alerts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s development/adaptive_replay/offline_campaign_bridge_tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

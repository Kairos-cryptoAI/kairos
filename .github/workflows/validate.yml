name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate runner, manifest, and documentation links
        shell: pwsh
        run: ./tests/Test-Meta.Static.ps1
      - name: Verify non-trading Telegram handoff offline
        shell: pwsh
        run: |
          python -m unittest discover -s development/ops_alerts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s development/adaptive_replay/offline_campaign_bridge_tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

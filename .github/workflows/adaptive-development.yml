name: adaptive-development

on:
  push:
    branches: [main]
    paths:
      - development/adaptive_replay/**
      - development/market_review/**
      - .github/workflows/adaptive-development.yml
      - .gitattributes
      - docs/ADAPTIVE-DEVELOPMENT-*.md
      - docs/MARKET-REVIEW-*.md
      - docs/STRATEGY-COMPARISON-*.md
      - docs/STRATEGY-SELECTION-*.md
      - docs/STRATEGY-CALENDAR-*.md
      - docs/STRATEGY-PRICE-*.md
      - docs/STRATEGY-INTRADAY-*.md
      - docs/STRATEGY-FILTER-*.md
      - docs/STRATEGY-CATALYST-*.md
      - docs/FULL-SYSTEM-EVALUATION-*.md
      - docs/NATIVE-OBSERVATION-IMPORT-*.md
      - docs/HISTORICAL-CONTEXT-*.md
      - docs/HISTORICAL-PILOT-*.md
  pull_request:
    paths:
      - development/adaptive_replay/**
      - development/market_review/**
      - .github/workflows/adaptive-development.yml
      - .gitattributes
      - docs/ADAPTIVE-DEVELOPMENT-*.md
      - docs/MARKET-REVIEW-*.md
      - docs/STRATEGY-COMPARISON-*.md
      - docs/STRATEGY-SELECTION-*.md
      - docs/STRATEGY-CALENDAR-*.md
      - docs/STRATEGY-PRICE-*.md
      - docs/STRATEGY-INTRADAY-*.md
      - docs/STRATEGY-FILTER-*.md
      - docs/STRATEGY-CATALYST-*.md
      - docs/FULL-SYSTEM-EVALUATION-*.md
      - docs/NATIVE-OBSERVATION-IMPORT-*.md
      - docs/HISTORICAL-CONTEXT-*.md
      - docs/HISTORICAL-PILOT-*.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11.15", "3.14.7"]
        fixture_group: [regular, five-day-horizon]
    runs-on: ${{ matrix.os }}
    # Exact disjoint union: 2,426 regular cases plus one complete 36,000-cell horizon.
    # The long case is a separate bounded job, never sampled or skipped.
    # Windows CPython 3.11 regular suite has repeatedly taken 33–55 minutes;
    # keep the normal cap elsewhere and leave this measured outlier headroom.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.python == '3.11.15' && matrix.fixture_group == 'regular' && 75 || 60 }}
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.adaptive-development-env
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked tooling
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - name: Install isolated immutable dependencies and non-editable replay wheel
        working-directory: development/adaptive_replay
        run: uv sync --locked --no-editable --reinstall-package kairos-adaptive-development-replay --managed-python --python ${{ matrix.python }}
      - name: Check code style
        working-directory: development/adaptive_replay
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Verify offline fixture and installed-source boundaries
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'development/adaptive_replay'
          $testPath = Join-Path $project 'tests'
          $fixtureGroup = '${{ matrix.fixture_group }}'
          $longTestName = 'test_real_full_five_day_portfolio_partial_cross_day_funding_cost_restart'
          $longTestFile = Join-Path $testPath 'test_continuous_sim_v3_horizon.py'
          $longNodeId = 'tests/test_continuous_sim_v3_horizon.py::' + $longTestName
          if ($fixtureGroup -eq 'five-day-horizon') {
            $fixtureArgs = @('{0}::{1}' -f $longTestFile, $longTestName)
            $expectedTotal = 1
          } elseif ($fixtureGroup -eq 'regular') {
            $fixtureArgs = @($testPath, '--deselect', $longNodeId)
            $expectedTotal = 2426
          } else { throw 'Unrecognized fixture partition' }
          $reportPath = Join-Path $env:RUNNER_TEMP ('adaptive-offline-' + $fixtureGroup + '.xml')
          Set-Location $env:RUNNER_TEMP
          $installedProfile = uv run --no-sync --project $project python -I -c 'import adaptive_replay.research_profile_v1 as p; print(p.__file__)'
          if ($LASTEXITCODE -ne 0 -or $installedProfile -notmatch 'site-packages') {
            throw 'The exact new profile must be imported from the non-editable installed wheel'
          }
          $checkoutProfile = Join-Path $project 'adaptive_replay/research_profile_v1.py'
          if ((Get-FileHash -LiteralPath $installedProfile -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $checkoutProfile -Algorithm SHA256).Hash) {
            throw 'Cached installed profile bytes differ from the checked-out source'
          }
          foreach ($module in @('catalyst_policy_v1', 'catalyst_hypothesis_v1')) {
            $installed = uv run --no-sync --project $project python -I -c "import adaptive_replay.$module as p; print(p.__file__)"
            if ($LASTEXITCODE -ne 0 -or $installed -notmatch 'site-packages') {
              throw 'The new catalyst policy must be imported from the non-editable wheel'
            }
            $checkout = Join-Path $project ('adaptive_replay/' + $module + '.py')
            if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $checkout -Algorithm SHA256).Hash) {
              throw 'Cached installed catalyst policy differs from the checked-out source'
            }
          }
          uv run --no-sync --project $project python -I -m pytest --rootdir=$project --import-mode=importlib @fixtureArgs -q -W error --durations=15 --junitxml=$reportPath
          if ($LASTEXITCODE -ne 0) { throw 'Offline adaptive development fixture gate failed' }
          [xml]$report = Get-Content -LiteralPath $reportPath -Raw
          $total = 0; $failed = 0; $skipped = 0
          foreach ($suite in $report.testsuites.testsuite) {
            $total += [int]$suite.tests
            $failed += [int]$suite.failures + [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          $passed = $total - $failed - $skipped
          if ($total -ne $expectedTotal -or $passed -le 0 -or $failed -ne 0) {
            throw 'Incomplete exact fixture partition, no passing proof or retained failures'
          }
          if ($fixtureGroup -eq 'five-day-horizon' -and $skipped -ne 0) {
            throw 'The complete long horizon must actually pass without a skip'
          }
          Write-Output "OFFLINE_FIXTURE_COUNTS group=$fixtureGroup total=$total passed=$passed skipped=$skipped failed=$failed full_universe=2427"
      - name: Check market-only research code and offline evidence guards (never paid)
        if: ${{ matrix.fixture_group == 'regular' }}
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'development/adaptive_replay'
          $research = Join-Path $env:GITHUB_WORKSPACE 'development/market_review'
          Set-Location $env:RUNNER_TEMP
          uv run --no-sync --project $project ruff check $research
          if ($LASTEXITCODE -ne 0) { throw 'Market review style gate failed' }
          uv run --no-sync --project $project ruff format --check $research
          if ($LASTEXITCODE -ne 0) { throw 'Market review formatting gate failed' }
          uv run --no-sync --project $project python -m pytest --rootdir=$research --confcutdir=$research --import-mode=importlib $research -q -W error
          if ($LASTEXITCODE -ne 0) { throw 'Market review offline evidence gate failed' }
